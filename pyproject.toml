[project]
name = "maksim"
version = "0.1.0"
description = "Always-on Russian voice assistant for macOS"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "groq>=0.13.0",
    "elevenlabs>=1.50.0",
    "openwakeword>=0.6.0",
    "silero-vad>=5.1.0",
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.1",
    "numpy>=1.26.0,<2.3",
    "onnxruntime>=1.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "rich>=13.9.0",
    "soundfile>=0.12.1",
    "websockets>=13.0",
    "rumps>=0.4.0",
    "omegaconf>=2.3.0",
]

[project.scripts]
maksim = "maksim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maksim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pyinstaller>=6.20.0",
]
